server {
    listen 80;
    server_name _;

    # The FastAPI application enforces the configured MAX_UPLOAD_MB limit.
    # Keep proxy threshold above that application limit and multipart overhead.
    client_max_body_size 2g;
    client_body_timeout 600s;
    send_timeout 600s;

    # Preview URLs carry short-lived bearer grants. Suppress request URI logs
    # so the token is not copied into nginx access logs.
    location ~ ^/api/jobs/[0-9a-fA-F-]+/(preview|captions\.vtt)$ {
        access_log off;
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
