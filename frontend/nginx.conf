server {
    listen 80;
    server_name _;

    # The FastAPI application enforces the configured MAX_UPLOAD_MB limit.
    # Keep proxy threshold above that application limit and multipart overhead.
    client_max_body_size 2g;
    client_body_timeout 600s;
    send_timeout 600s;

    # Re-resolve the api service through Docker's embedded DNS so recreating
    # the api container (new IP) does not leave nginx proxying to a stale
    # address and returning 502 until web is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # Preview URLs carry short-lived bearer grants. Suppress request URI logs
    # so the token is not copied into nginx access logs.
    location ~ ^/api/jobs/[0-9a-fA-F-]+/(preview|captions\.vtt)$ {
        access_log off;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        proxy_request_buffering off;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
