# CPU-friendly offline Ollama post-editing. Use with compose.yaml and compose.real.yaml.
# Pull model weights before disconnecting from the Internet; no public Ollama port.
services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.12.10}
    restart: unless-stopped
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
    volumes:
      - ollama_models:/root/.ollama
    networks: [backend]
  worker:
    environment:
      LLM_POSTEDIT_ENABLED: ${LLM_POSTEDIT_ENABLED:-false}
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434/v1
      LLM_MODEL: ${OLLAMA_MODEL:-qwen3:4b-instruct}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_FAIL_OPEN: ${LLM_FAIL_OPEN:-true}
      LLM_TOTAL_BUDGET_SECONDS: ${LLM_TOTAL_BUDGET_SECONDS:-900}
    depends_on:
      ollama: {condition: service_started}
volumes:
  ollama_models:
