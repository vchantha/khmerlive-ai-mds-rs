name: Docker Compose research MVP
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure local demo secrets
        run: cp .env.example .env
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build all local application images
        run: docker compose build
      - name: Start research MVP
        run: docker compose up -d
      - name: Python contract tests
        run: docker compose run --rm --no-deps api pytest -q
      - name: Health checks
        run: |
          for i in $(seq 1 40); do
            curl -fsS http://localhost:8080/api/health/ready && exit 0
            sleep 3
          done
          docker compose ps && docker compose logs --tail=100
          exit 1
      - name: Show service state on failure
        if: failure()
        run: docker compose ps && docker compose logs --tail=200
      - name: Cleanup
        if: always()
        run: docker compose down -v --remove-orphans
