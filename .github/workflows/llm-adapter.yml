name: Offline LLM adapter validation
on:
  push:
    paths:
      - "backend/app/config.py"
      - "backend/app/llm_postedit.py"
      - "backend/tests/test_llm_postedit.py"
      - "backend/tests/test_llm_guards.py"
      - "backend/app/evaluation.py"
      - "backend/tests/test_evaluation.py"
      - "scripts/build-eval-set.py"
      - "compose.ollama.yaml"
      - "compose.vllm.yaml"
      - ".github/workflows/llm-adapter.yml"
  pull_request:
  workflow_dispatch:
jobs:
  offline-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install "pytest==8.3.5" "httpx==0.28.1" "pydantic-settings==2.8.1"
      - name: Check Python syntax
        run: python -m compileall -q backend/app/llm_postedit.py backend/app/config.py backend/tests/test_llm_postedit.py backend/tests/test_llm_guards.py backend/app/evaluation.py backend/tests/test_evaluation.py scripts/build-eval-set.py backend/app/tasks.py
      - name: Run offline LLM adapter tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_llm_postedit.py backend/tests/test_llm_guards.py backend/tests/test_evaluation.py
      - name: Check Ollama Compose config
        run: |
          cp .env.example .env
          docker compose -f compose.yaml -f compose.real.yaml -f compose.ollama.yaml config --quiet
      - name: Check vLLM Compose config
        run: docker compose -f compose.yaml -f compose.real.yaml -f compose.vllm.yaml --profile vllm config --quiet
